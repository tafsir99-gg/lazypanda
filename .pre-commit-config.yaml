# .pre-commit-config.yaml
#
# WHY pre-commit hooks?
#   These checks run automatically every time you do `git commit`.
#   They catch problems BEFORE they enter your git history.
#   Bad code never reaches main.
#
# SETUP (run once after cloning):
#   uv run pre-commit install
#
# MANUAL RUN (check all files now):
#   uv run pre-commit run --all-files

repos:
  # ─── Ruff: Fast Python linter + formatter ─────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff           # Lint: catch bugs, bad patterns, unused imports
        args: [--fix]      # Auto-fix safe issues
      - id: ruff-format    # Format: consistent code style

  # ─── Basic file quality checks ────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace     # Remove trailing spaces
      - id: end-of-file-fixer       # Ensure files end with newline
      - id: check-yaml              # Validate YAML files
      - id: check-toml              # Validate pyproject.toml
      - id: check-added-large-files # Warn if you try to commit large files
        args: [--maxkb=500]
      - id: check-merge-conflict    # Catch unresolved merge conflicts
      - id: detect-private-key      # Catch accidentally committed API keys
